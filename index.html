<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Плейлист нашей истории</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ═══════════════════════════════════════ */
        /*   ПРИВЕТСТВЕННЫЙ ЭКРАН                  */
        /* ═══════════════════════════════════════ */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        #splash.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            animation: splashIn 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            user-select: none;
        }

        @keyframes splashIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .splash-icon {
            font-size: 80px;
            margin-bottom: 16px;
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .splash-title {
            color: #fff;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .splash-title span {
            color: #d4a745;
        }

        .splash-sub {
            color: #666;
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: 300;
        }

        .splash-months {
            margin-top: 20px;
            color: #d4a745;
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .splash-hint {
            margin-top: 32px;
            color: #444;
            font-size: 12px;
            letter-spacing: 2px;
            animation: blinkHint 1.8s ease-in-out infinite;
            border: 1px solid rgba(212, 167, 69, 0.1);
            padding: 10px 28px;
            border-radius: 40px;
            transition: border-color 0.4s ease;
        }

        #splash:hover .splash-hint {
            border-color: rgba(212, 167, 69, 0.3);
        }

        @keyframes blinkHint {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ═══════════════════════════════════════ */
        /*   ЗВЁЗДЫ И ПЛЕЕР (как было)            */
        /* ═══════════════════════════════════════ */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .player {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            background: linear-gradient(145deg, rgba(26, 26, 26, 0.88), rgba(13, 13, 13, 0.92));
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.08);
        }

        .player-header h1 {
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .player-header span {
            color: #d4a745;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border-radius: 16px;
            background: transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
        }

        .track:hover {
            background: rgba(212, 167, 69, 0.06);
            border-color: rgba(212, 167, 69, 0.15);
            transform: translateX(6px);
        }

        .track-number {
            color: #444;
            font-size: 13px;
            font-weight: 600;
            width: 30px;
            transition: color 0.3s;
        }

        .track:hover .track-number {
            color: #d4a745;
        }

        .track-info {
            flex: 1;
            margin-left: 10px;
        }

        .track-title {
            color: #eee;
            font-size: 16px;
            font-weight: 400;
            transition: color 0.3s;
        }

        .track:hover .track-title {
            color: #fff;
        }

        .track-sub {
            color: #666;
            font-size: 12px;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        .track-icon {
            color: #444;
            font-size: 18px;
            transition: all 0.3s;
        }

        .track:hover .track-icon {
            color: #d4a745;
            transform: scale(1.1);
        }

        .track.secret .track-title {
            color: #6a5a3a;
        }
        .track.secret:hover .track-title {
            color: #d4a745;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            max-width: 460px;
            width: 92%;
            background: rgba(26, 26, 26, 0.92);
            border-radius: 32px;
            padding: 40px 30px;
            border: 1px solid rgba(212, 167, 69, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            animation: slideUp 0.4s ease;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            color: #555;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: #d4a745;
        }

        .modal-image {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .modal-title {
            color: #fff;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .modal-description {
            color: #bbb;
            font-size: 15px;
            line-height: 1.7;
            margin-top: 12px;
        }

        .modal-date {
            color: #666;
            font-size: 12px;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        .secret-trigger {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            color: #222;
            font-size: 11px;
            letter-spacing: 4px;
            cursor: default;
            user-select: none;
            transition: color 0.5s;
        }

        .secret-trigger:hover {
            color: #d4a745;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .player {
                padding: 25px 18px;
                border-radius: 28px;
            }
            .track {
                padding: 12px 14px;
            }
            .track-title {
                font-size: 14px;
            }
            .modal {
                padding: 28px 20px;
            }
            .modal-image {
                height: 160px;
            }
            .splash-title {
                font-size: 24px;
            }
            .splash-icon {
                font-size: 60px;
            }
            .splash-hint {
                font-size: 11px;
                padding: 8px 20px;
            }
        }

        @media (max-width: 380px) {
            .player-header h1 {
                font-size: 14px;
                letter-spacing: 2px;
            }
            .player-header span {
                font-size: 11px;
            }
            .track-title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══ ПРИВЕТСТВЕННЫЙ ЭКРАН ═══ -->
    <div id="splash">
        <div class="splash-content">
            <div class="splash-icon">🌙</div>
            <div class="splash-title">You & <span>Me</span></div>
            <div class="splash-hint">нажми в любом месте</div>
        </div>
    </div>

    <!-- ═══ ЗВЁЗДНОЕ ПОЛОТНО ═══ -->
    <canvas id="starfield"></canvas>

    <!-- ═══ ПЛЕЕР ═══ -->
    <div class="player" id="player">
        <div class="player-header">
            <h1>✦ Наши треки</h1>
        </div>
        <div class="track-list" id="trackList"></div>
        <div class="secret-trigger" id="secretTrigger">⏤ ⏤ ⏤ ⏤ ⏤</div>
    </div>

    <!-- ═══ МОДАЛКА ═══ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-image" id="modalImage"></div>
            <h2 class="modal-title" id="modalTitle">Название</h2>
            <p class="modal-description" id="modalDescription">Описание</p>
            <div class="modal-date" id="modalDate">—</div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════
        //  0. ПРИВЕТСТВЕННЫЙ ЭКРАН (только по клику)
        // ═══════════════════════════════════════════════════════

        const splash = document.getElementById('splash');

        function hideSplash() {
            splash.classList.add('hide');
            setTimeout(() => {
                splash.style.display = 'none';
            }, 1200);
        }

        // Переход только по клику
        splash.addEventListener('click', hideSplash);

        // ═══════════════════════════════════════════════════════
        //  1. ЗВЁЗДНОЕ НЕБО (Canvas + параллакс / гироскоп)
        // ═══════════════════════════════════════════════════════

        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let W, H;

        let stars = [];
        let shootingStars = [];
        const STAR_COUNT = 300;
        const SHOOTING_STAR_INTERVAL = 3000;

        let mouseX = 0;
        let mouseY = 0;

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / W - 0.5) * 2;
            mouseY = (e.clientY / H - 0.5) * 2;
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const gamma = e.gamma || 0;
                const beta = e.beta || 0;
                mouseX = gamma / 45;
                mouseY = beta / 90 - 0.2;
                if (mouseX > 1) mouseX = 1;
                if (mouseX < -1) mouseX = -1;
                if (mouseY > 1) mouseY = 1;
                if (mouseY < -1) mouseY = -1;
            }, { passive: true });
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    radius: Math.random() * 1.8 + 0.3,
                    baseX: Math.random() * W,
                    baseY: Math.random() * H,
                    speed: 0.002 + Math.random() * 0.008,
                    phase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 0.001 + Math.random() * 0.003,
                    color: `hsl(${40 + Math.random() * 20}, ${30 + Math.random() * 40}%, ${70 + Math.random() * 30}%)`
                });
            }
        }
        createStars();

        function createShootingStar() {
            const x = Math.random() * W * 0.8 + W * 0.1;
            const y = Math.random() * H * 0.3;
            const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.5;
            const speed = 6 + Math.random() * 8;
            shootingStars.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 0.006 + Math.random() * 0.008,
                length: 60 + Math.random() * 80,
                radius: 1.5 + Math.random() * 1.5
            });
        }

        setInterval(() => {
            if (Math.random() < 0.4) {
                for (let i = 0; i < 1 + Math.floor(Math.random() * 2); i++) {
                    setTimeout(() => createShootingStar(), i * 200);
                }
            }
        }, SHOOTING_STAR_INTERVAL);

        setTimeout(createShootingStar, 2000);

        function drawStars() {
            ctx.clearRect(0, 0, W, H);

            for (const star of stars) {
                const twinkle = Math.sin(Date.now() * star.twinkleSpeed + star.phase) * 0.2 + 0.8;
                const radius = star.radius * (0.7 + twinkle * 0.3);

                const dx = (star.baseX - W / 2) * 0.03 * mouseX;
                const dy = (star.baseY - H / 2) * 0.03 * mouseY;

                const x = star.baseX + dx;
                const y = star.baseY + dy;

                if (star.radius > 1.2) {
                    const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 4);
                    glow.addColorStop(0, `rgba(255, 215, 140, ${twinkle * 0.15})`);
                    glow.addColorStop(1, 'rgba(255, 215, 140, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(x, y, radius * 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(x, y, radius * twinkle, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.shadowColor = `rgba(255, 215, 140, ${twinkle * 0.2})`;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life -= s.decay;

                if (s.life <= 0 || s.x > W + 50 || s.y > H + 50 || s.x < -50 || s.y < -50) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                const alpha = s.life * 0.9;
                const tailX = s.x - s.vx / s.vy * s.length * 0.5;
                const tailY = s.y - s.length * 0.5;

                const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255, 240, 210, ${alpha})`);
                grad.addColorStop(0.3, `rgba(255, 215, 150, ${alpha * 0.5})`);
                grad.addColorStop(1, `rgba(255, 200, 100, 0)`);

                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = grad;
                ctx.lineWidth = s.radius * s.life * 1.8;
                ctx.lineCap = 'round';
                ctx.stroke();

                const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius * 6);
                glow.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.7})`);
                glow.addColorStop(0.2, `rgba(255, 230, 180, ${alpha * 0.4})`);
                glow.addColorStop(1, `rgba(255, 200, 100, 0)`);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius * 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius * s.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
                ctx.shadowColor = `rgba(255, 215, 140, ${alpha * 0.6})`;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(drawStars);
        }
        drawStars();

        window.addEventListener('resize', () => {
            resizeCanvas();
            createStars();
        });

        // ═══════════════════════════════════════════════════════
        //  2. ДАННЫЕ ТРЕКОВ
        // ═══════════════════════════════════════════════════════

        const tracks = [{
            id: 1,
            title: 'Знакомство',
            subtitle: '29 марта',
            description: 'Ты написала первой. Я тогда ещё не знал, что это изменит всё. А ты уже тогда была особенной - просто не показывала виду)',
            date: 'Март 2026',
            img: './images/1.png'
        }, {
            id: 2,
            title: 'Наши разговоры',
            subtitle: 'Узнаем больше',
            description: 'Чем больше мы болтали, тем сильнее я хотел тебя увидеть. И с каждым днём понимал, что с тобой правда легко и тепло.',
            date: 'Март – Апрель 2026',
            img: './images/2.png'
        }, {
            id: 3,
            title: 'Первая встреча',
            subtitle: 'Ты подошла сзади',
            description: 'Довольно неожиданно получилось. Мы хорошо погуляли, и ещё тогда завели тему пошлых шуточек хахах))',
            date: 'Апрель 2026',
            img: './images/3.png'
        }, {
            id: 4,
            title: 'На мотоцикле',
            subtitle: 'Ветер, дорога, ты',
            description: 'Я так хотел тебя прокатить! И когда ты села и мы поехали, я окончательно понял, что хочу быть с тобой)',
            date: 'Август 2026',
            img: './images/4.png'
        }, {
            id: 5,
            title: 'Главный вопрос',
            subtitle: 'Будешь моей дамой сердца?',
            description: 'Я волновался, долго думал как сказать то. Но когда ты согласилась, я был очень рад и стало так хорошо. А самое главное, что мы это обсудили вживую.',
            date: 'Август 2026',
            img: './images/5.png'
        }, {
            id: 6,
            title: 'Сегодня',
            subtitle: 'Прямо сейчас',
            description: 'Ты читаешь это, а я улыбаюсь. Потому что ты есть. Спасибо, что ты у меня есть)',
            date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }),
            img: './images/6.png'
        }];

        const secretTrack = {
            title: '❖ Секретный трек',
            subtitle: 'Только тебе',
            description: 'Я не знал, что написать сюда. Но знаю одно. За эти 5 месяцев я стал счастливее. Потому что ты появилась в моей жизни. Я тебя люблю 💓😘',
            date: 'Навсегда',
            img: './images/7.png'
        };

        // ═══════════════════════════════════════════════════════
        //  3. ЛОГИКА РАБОТЫ ПЛЕЕРА
        // ═══════════════════════════════════════════════════════

        const trackListEl = document.getElementById('trackList');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalTitle = document.getElementById('modalTitle');
        const modalDescription = document.getElementById('modalDescription');
        const modalDate = document.getElementById('modalDate');
        const modalImage = document.getElementById('modalImage');

        let secretUnlocked = false;
        let secretClickCount = 0;

        function renderTracks() {
            trackListEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track';
                trackEl.innerHTML = `
                    <span class="track-number">${String(index + 1).padStart(2, '0')}</span>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-sub">${track.subtitle}</div>
                    </div>
                    <span class="track-icon">▶</span>
                `;
                trackEl.addEventListener('click', () => openModal(track));
                trackListEl.appendChild(trackEl);
            });

            if (secretUnlocked) {
                const secretEl = document.createElement('div');
                secretEl.className = 'track secret';
                secretEl.innerHTML = `
                    <span class="track-number">♢</span>
                    <div class="track-info">
                        <div class="track-title">${secretTrack.title}</div>
                        <div class="track-sub">${secretTrack.subtitle}</div>
                    </div>
                    <span class="track-icon">✦</span>
                `;
                secretEl.addEventListener('click', () => openModal(secretTrack));
                trackListEl.appendChild(secretEl);
            }
        }

        function openModal(track) {
            modalTitle.textContent = track.title;
            modalDescription.textContent = track.description;
            modalDate.textContent = track.date || '';

            if (track.img && track.img.trim() !== '') {
                modalImage.innerHTML = `<img src="${track.img}" alt="${track.title}">`;
                modalImage.style.display = 'block';
            } else {
                modalImage.innerHTML = '📷';
                modalImage.style.display = 'flex';
                modalImage.style.alignItems = 'center';
                modalImage.style.justifyContent = 'center';
                modalImage.style.color = '#444';
                modalImage.style.fontSize = '40px';
                modalImage.style.background = 'rgba(255,255,255,0.02)';
            }

            modalOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('secretTrigger').addEventListener('click', () => {
            secretClickCount++;
            if (secretClickCount === 5 && !secretUnlocked) {
                secretUnlocked = true;
                renderTracks();
                const trigger = document.getElementById('secretTrigger');
                trigger.style.color = '#d4a745';
                trigger.textContent = '✦ Секрет открыт ✦';
                setTimeout(() => {
                    trigger.style.color = '#222';
                    trigger.textContent = '⏤ ⏤ ⏤ ⏤ ⏤';
                }, 2000);
            }
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        modalClose.addEventListener('click', closeModal);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderTracks();

        setInterval(() => {
            const todayTrack = tracks.find(t => t.title === 'Сегодня');
            if (todayTrack) {
                todayTrack.date = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            }
        }, 60000);
    </script>

</body>
</html>
